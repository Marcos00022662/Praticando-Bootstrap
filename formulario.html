<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Ícone da aba -->
    <link rel="icon" type="image/png" sizes="32x32"
        href="https://getbootstrap.com/docs/5.3/assets/img/favicons/favicon-32x32.png">

    <style>
        body {
            background:
                radial-gradient(ellipse at top left, rgba(124, 58, 237, 0.35), transparent 45%),
                linear-gradient(145deg, #2e1065, #08040f 75%);
            min-height: 100vh;
            color: white;
        }

        main {
            width: 100%;
            max-width: 400px;
        }

        .btn-roxo {
            background-color: #7c3aed;
            color: white;
            border: none;
        }

        .btn-roxo:hover {
            background-color: #6d28d9;
            color: white;
        }

        .link-voltar:hover {
            color: #fff !important;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <main class="text-center">
        <form id="formLogin">

            <!-- Logo do Bootstrap -->
            <img
                src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo-shadow.png"
                alt="Logo do Bootstrap"
                class="mb-4"
                height="52"
                width="72"
            >

            <h1 class="h3 mb-3 fw-normal">Formulário de Login</h1>

            <!-- Campo de e-mail -->
            <div class="form-floating mb-3">
                <input
                    type="email"
                    class="form-control"
                    id="floatingEmail"
                    name="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                >
                <label for="floatingEmail">E-mail</label>
            </div>

            <!-- Campo de senha -->
            <div class="form-floating mb-3">
                <input
                    type="password"
                    class="form-control"
                    id="floatingPassword"
                    name="senha"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                >
                <label for="floatingPassword">Senha</label>
            </div>

            <!-- Lembrar usuário -->
            <div class="form-check text-start my-3">
                <input
                    type="checkbox"
                    class="form-check-input"
                    id="flexCheckDefault"
                    name="lembrar"
                >
                <label class="form-check-label" for="flexCheckDefault">
                    Lembrar de mim
                </label>
            </div>

            <!-- Botão de entrar -->
            <button class="btn btn-roxo w-100 py-2" type="submit">
                Entrar
            </button>

        </form>

        <!-- Link de volta para a loja -->
        <a href="index.html" class="link-voltar d-inline-block mt-3 text-decoration-none text-white-50">
            <i class="bi bi-arrow-left"></i> Voltar para a loja
        </a>
    </main>

    <script>
        // Ao enviar (campos válidos), vai para a página inicial
        document.getElementById('formLogin').addEventListener('submit', function (e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
